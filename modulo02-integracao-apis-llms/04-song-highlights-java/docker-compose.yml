services:
  postgres:
    container_name: song-highlights-java-postgres
    restart: always
    image: postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: song_highlights_java
    volumes:
      - "./dbdata:/var/lib/postgresql"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
