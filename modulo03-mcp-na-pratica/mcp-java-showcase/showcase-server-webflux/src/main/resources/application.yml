server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: showcase-server-webflux
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: showcase-webflux
        version: 1.0.0
        type: SYNC
        instructions: >
          Servidor de demonstracao do MCP Java SDK sobre WebFlux (Streamable HTTP reativo).
        request-timeout: 30s
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        tool-change-notification: true
        resource-change-notification: true
        prompt-change-notification: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    br.dev.showcase: DEBUG
    io.modelcontextprotocol: INFO

---
# Perfil STATELESS: sem sessao, pensado para escalar atras de um load balancer.
# Nao ha canal servidor -> cliente, entao sampling, elicitation, roots, progresso e
# logging ficam indisponiveis; as tools do core detectam isso e degradam sozinhas.
spring:
  config:
    activate:
      on-profile: stateless
  ai:
    mcp:
      server:
        protocol: STATELESS
        name: showcase-webflux-stateless
        streamable-http:
          mcp-endpoint: /mcp
