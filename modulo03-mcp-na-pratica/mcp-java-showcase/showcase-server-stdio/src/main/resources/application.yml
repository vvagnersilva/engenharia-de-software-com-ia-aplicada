spring:
  application:
    name: showcase-server-stdio
  main:
    # STDIO nao sobe servidor web e o banner poluiria o stdout do protocolo.
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        enabled: true
        # Liga o transporte STDIO. O starter base nao expoe HTTP.
        stdio: true
        name: showcase-stdio
        version: 1.0.0
        type: SYNC
        instructions: >
          Servidor de demonstracao do MCP Java SDK. Expoe tools de catalogo, resources
          estaticos e por template, prompts, completions, sampling, elicitation e roots.
        request-timeout: 30s
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        tool-change-notification: true
        resource-change-notification: true
        prompt-change-notification: true

logging:
  # Nada de log no stdout: ele pertence ao JSON-RPC.
  pattern:
    console: ""
  file:
    name: ${SHOWCASE_LOG_FILE:./logs/showcase-server-stdio.log}
  level:
    root: INFO
    br.dev.showcase: DEBUG
